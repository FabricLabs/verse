<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Theme Song Player</title>
</head>
<body>
    <h1>Theme</h1>
    <p>The main theme of the game</p>

    <h2>Core</h2>
    <p>The core part of the game's theme song.</p>
    <button onclick="playCore()">Play Core</button>

    <h2>Intro</h2>
    <p>Intro variant with sustained holds on emphasized 'and' beats</p>
    <button onclick="playIntro()">Play Intro</button>

    <script>
        const noteToFreq = (note) => {
            const notes = { 'C':0, 'C#':1, 'D':2, 'D#':3, 'E':4, 'F':5, 'F#':6, 'G':7, 'G#':8, 'A':9, 'A#':10, 'B':11 };
            const base = note.replace(/\d$/, '');
            const oct = parseInt(note.match(/\d$/)[0]);
            const semitone = notes[base];
            const midi = 12 * (oct + 1) + semitone;
            return 440 * Math.pow(2, (midi - 69) / 12);
        };

        const playMelody = (notes, isAdvanced = false, bpm = 90) => {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const beatTime = 60 / bpm;
            let currentTime = audioCtx.currentTime;
            notes.forEach(n => {
                let noteName, durBeats, velocity, attack = 0.05, decay = 0.1, sustain = 0.7, release = 0.2;
                if (!isAdvanced) {
                    noteName = n;
                    durBeats = 1;
                    velocity = 0.8;
                } else {
                    const parts = n.split(':');
                    noteName = parts[0];
                    durBeats = parseFloat(parts[1]);
                    velocity = parseFloat(parts[2]);
                    if (parts.length > 4 && parts[4]) attack = parseFloat(parts[4]);
                    if (parts.length > 5 && parts[5]) decay = parseFloat(parts[5]);
                    if (parts.length > 6 && parts[6]) release = parseFloat(parts[6]);
                }
                const freq = noteToFreq(noteName);
                const osc = audioCtx.createOscillator();
                osc.type = 'sine';
                osc.frequency.value = freq;
                const gainNode = audioCtx.createGain();
                osc.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                const noteStart = currentTime;
                const attackEnd = noteStart + attack;
                const decayEnd = attackEnd + decay;
                const holdEnd = noteStart + (durBeats * beatTime);
                const releaseEnd = holdEnd + release;
                gainNode.gain.setValueAtTime(0, noteStart);
                gainNode.gain.linearRampToValueAtTime(velocity, attackEnd);
                gainNode.gain.linearRampToValueAtTime(sustain * velocity, decayEnd);
                gainNode.gain.setValueAtTime(sustain * velocity, holdEnd);
                gainNode.gain.linearRampToValueAtTime(0, releaseEnd);
                osc.start(noteStart);
                osc.stop(releaseEnd);
                currentTime += durBeats * beatTime;
            });
        };

        const coreNotes = ["F#3", "E3", "F#3", "A3", "B3", "A3", "F#3", "E3", "D3", "C#3", "B2", "C#3", "D3", "F#3", "F#3", "E3", "F#3", "A3", "B3", "A3", "F#3", "E3", "D3", "C#3", "B2", "C#3", "D3", "F#3"];
        const introNotes = ["F#3:2.0:0.9::0.7:1.5:1", "E3:0.5:0.85::::", "F#3:1.0:0.85::0.6:0.8:", "A3:1.0:0.85::0.6:0.8:", "B3:1.0:0.88::0.6:0.8:", "C#4:1.0:0.9::0.6:0.8:", "E3:0.5:0.85::::", "F#3:1.0:0.95::::2", "F#3:2.0:0.9::0.7:1.5:1", "E3:0.5:0.85::::", "F#3:1.0:0.85::0.6:0.8:", "A3:1.0:0.85::0.6:0.8:", "B3:1.0:0.88::0.6:0.8:", "C#4:1.0:0.9::0.6:0.8:", "E3:0.5:0.85::::", "F#3:1.0:0.95::::2", "F#3:2.0:0.9::0.7:1.5:1", "E3:0.5:0.85::::", "F#3:1.0:0.85::0.6:0.8:", "A3:1.0:0.85::0.6:0.8:", "B3:1.0:0.88::0.6:0.8:", "C#4:1.0:0.9::0.6:0.8:", "E3:0.5:0.85::::", "F#3:1.0:0.95::::2"];

        function playCore() {
            playMelody(coreNotes, false, 90);
        }

        function playIntro() {
            playMelody(introNotes, true, 90);
        }
    </script>
</body>
</html>
