<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VERSE</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      background-color: #1e1e1e;
      color: #f0f0f0;
    }
    #container {
      position: absolute;
      width: 100%;
      height: 100%;
    }
    #controls {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 100;
      padding: 10px;
      background-color: rgba(0, 0, 0, 0.6);
      border-radius: 5px;
      max-width: 250px;
    }
    button {
      background-color: #4CAF50;
      border: none;
      color: white;
      padding: 8px 16px;
      text-align: center;
      text-decoration: none;
      display: inline-block;
      font-size: 14px;
      margin: 4px 2px;
      cursor: pointer;
      border-radius: 4px;
    }
    button:hover {
      background-color: #45a049;
    }
    input[type="file"] {
      display: none;
    }
    .custom-file-upload {
      background-color: #2196F3;
      border: none;
      color: white;
      padding: 8px 16px;
      text-align: center;
      text-decoration: none;
      display: inline-block;
      font-size: 14px;
      margin: 4px 2px;
      cursor: pointer;
      border-radius: 4px;
    }
    .custom-file-upload:hover {
      background-color: #0b7dda;
    }
    #info {
      margin-top: 10px;
      font-size: 12px;
    }
    .loader {
      border: 5px solid #f3f3f3;
      border-top: 5px solid #3498db;
      border-radius: 50%;
      width: 30px;
      height: 30px;
      animation: spin 2s linear infinite;
      margin: 10px auto;
      display: none;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    #tooltip {
      position: absolute;
      background-color: rgba(0, 0, 0, 0.7);
      color: white;
      padding: 5px 10px;
      border-radius: 5px;
      font-size: 12px;
      pointer-events: none;
      z-index: 100;
      display: none;
    }
    .control-group {
      margin-top: 15px;
      border-top: 1px solid #444;
      padding-top: 10px;
    }
    .checkbox-label {
      display: flex;
      align-items: center;
      margin: 5px 0;
    }
    .checkbox-label input {
      margin-right: 5px;
    }
    #sample-link {
      display: block;
      margin-top: 10px;
      color: #2196F3;
      text-decoration: underline;
      cursor: pointer;
    }
    #pip-topdown, #pip-iso, #pip-fp {
      position: absolute;
      width: 220px;
      height: 220px;
      z-index: 200;
      pointer-events: none;
      background: rgba(30,30,30,0.85);
      display: none; /* Hide by default */
    }
    #pip-topdown, #pip-iso {
      border: 2px solid #2196F3;
    }
    #pip-fp {
      border: 2px solid #FF4500;
      bottom: 260px;
      right: 20px;
    }
    #pip-topdown {
      top: 20px;
      right: 20px;
    }
    #pip-iso {
      bottom: 20px;
      right: 20px;
    }
    .pip-container {
      cursor: pointer;
      pointer-events: auto !important;
    }
    #stats {
      position: absolute;
      bottom: 0;
      left: 0;
      z-index: 100;
    }
  </style>
</head>
<body>
  <div id="container"></div>
  <div id="controls">
    <h2>VERSE</h2>
    <label class="custom-file-upload">
      <input type="file" id="fileInput" accept=".txt,.hex,.world"/>
      Load World File
    </label>
    <button id="resetCamera">Reset Camera</button>
    <a id="sample-link">Load Sample World</a>

    <div class="control-group">
      <h3>Display Options</h3>
      <label class="checkbox-label">
        <input type="checkbox" id="showGrid">
        Show Grid
      </label>
      <label class="checkbox-label">
        <input type="checkbox" id="showAxes">
        Show Axes
      </label>
      <label class="checkbox-label">
        <input type="checkbox" id="enableInspection" checked>
        Enable Voxel Inspection
      </label>
    </div>

    <div class="control-group">
      <h3>Actions</h3>
      <button id="saveWorld">Save World</button>
    </div>

    <div id="info">
      <p>World details will appear here...</p>
    </div>
    <div class="loader" id="loader"></div>
  </div>

  <div id="tooltip"></div>
  <!-- Modal for voxel details -->
  <div id="voxel-modal" style="display:none; position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(0,0,0,0.6); z-index:1000; align-items:center; justify-content:center;">
    <div style="background:#222; color:#fff; padding:24px 32px; border-radius:8px; min-width:320px; max-width:90vw; max-height:90vh; overflow:auto; box-shadow:0 8px 32px #000; position:relative;">
      <button id="close-voxel-modal" style="position:absolute; top:8px; right:12px; background:#444; color:#fff; border:none; border-radius:4px; padding:4px 10px; font-size:16px; cursor:pointer;">&times;</button>
      <h2>Voxel Details</h2>
      <div id="voxel-modal-content">Loading...</div>
    </div>
  </div>
  <!-- PIP overlays -->
  <div id="pip-topdown" class="pip-container"></div>
  <div id="pip-iso" class="pip-container"></div>
  <div id="pip-fp" class="pip-container"></div>

  <script src="/scripts/three.min.js"></script>
  <script src="/scripts/OrbitControls.js"></script>
  <script src="/scripts/stats.min.js"></script>

  <script>
    // Constants for voxel types mapped to colors
    const VOXEL_TYPES = {
      0: { name: 'AIR', color: 0x000000, opacity: 0.0 },
      1: { name: 'DIRT', color: 0x8B4513, opacity: 1.0 },
      2: { name: 'GRASS', color: 0x7CFC00, opacity: 1.0 },
      3: { name: 'STONE', color: 0x808080, opacity: 1.0 },
      4: { name: 'WATER', color: 0x1E90FF, opacity: 0.8 },
      5: { name: 'WOOD', color: 0x8B4513, opacity: 1.0 },
      6: { name: 'LEAVES', color: 0x228B22, opacity: 0.9 },
      7: { name: 'SAND', color: 0xF4A460, opacity: 1.0 }
    };

    // Initialize Three.js scene
    let scene, camera, renderer, controls;
    let worldWidth, worldHeight, worldDepth;
    let worldMesh;
    let raycaster, mouse;
    let gridHelper, axesHelper;
    let voxelData = []; // Store voxel data for raycasting
    let tooltip = document.getElementById('tooltip');
    let mouseMoveTimeout;
    // PIP overlay cameras
    let topDownCamera, isoCamera, fpCamera;
    const pipWidth = 220, pipHeight = 220;
    let lastInspectedVoxel = null;
    // Camera mode tracking
    let activeCameraMode = 'main'; // 'main', 'topdown', 'iso', 'fp'
    // Stats performance monitor
    let stats;

    // Track mouse position
    mouse = new THREE.Vector2();

    function init () {
      // Create scene
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x000000);

      // Create camera
      camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(50, 50, 50);
      camera.lookAt(0, 0, 0);

      // Create renderer
      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.getElementById('container').appendChild(renderer.domElement);

      // Add orbit controls
      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.25;
      controls.screenSpacePanning = false;
      controls.maxPolarAngle = Math.PI / 1.5;
      controls.minDistance = 5;
      controls.maxDistance = 500;

      // Add ambient light
      const ambientLight = new THREE.AmbientLight(0x606060);
      scene.add(ambientLight);

      // Add directional light
      const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
      directionalLight.position.set(1, 1, 1).normalize();
      scene.add(directionalLight);

      // Add grid helper for reference
      gridHelper = new THREE.GridHelper(100, 100);
      gridHelper.visible = false;  // Hide grid by default
      scene.add(gridHelper);

      // Add axes helper
      axesHelper = new THREE.AxesHelper(50);
      axesHelper.visible = false;  // Hide axes by default
      scene.add(axesHelper);

      // Setup raycaster for voxel inspection
      raycaster = new THREE.Raycaster();

      // Handle window resize
      window.addEventListener('resize', onWindowResize, false);

      // Handle mouse move for voxel inspection
      document.addEventListener('mousemove', onMouseMove, false);

      // Handle click for voxel modal
      renderer.domElement.addEventListener('click', onVoxelClick, false);

      // Top-down orthographic camera
      topDownCamera = new THREE.OrthographicCamera(
        -50, 50, 50, -50, 0.1, 1000
      );
      topDownCamera.position.set(0, 100, 0);
      topDownCamera.lookAt(0, 0, 0);
      topDownCamera.up.set(0, 0, -1); // So +Z is up in the view

      // Isometric camera (perspective, fixed angle)
      isoCamera = new THREE.PerspectiveCamera(75, pipWidth/pipHeight, 0.1, 1000);
      // 45° azimuth, ~35.26° elevation for isometric
      const isoDist = 100;
      const isoAngle = Math.PI / 4;
      const isoElev = Math.atan(Math.sqrt(2));
      isoCamera.position.set(
        isoDist * Math.cos(isoAngle),
        isoDist * Math.sin(isoElev),
        isoDist * Math.sin(isoAngle)
      );
      isoCamera.lookAt(0, 0, 0);

      // First-person camera (player view)
      fpCamera = new THREE.PerspectiveCamera(90, pipWidth/pipHeight, 0.1, 1000);
      fpCamera.position.set(0, 1, 0); // Eye level
      fpCamera.lookAt(10, 1, 0); // Looking forward along X axis

      // Set up PIP click handlers with explicit z-index control
      const pipTopdown = document.getElementById('pip-topdown');
      const pipIso = document.getElementById('pip-iso');
      const pipFp = document.getElementById('pip-fp');

      pipTopdown.addEventListener('click', function() {
        swapCameraView('topdown');
      });

      pipIso.addEventListener('click', function() {
        swapCameraView('iso');
      });

      pipFp.addEventListener('click', function() {
        swapCameraView('fp');
      });

      // Add Stats.js FPS counter
      stats = new Stats();
      stats.showPanel(0); // 0: fps, 1: ms, 2: mb, 3: custom
      document.getElementById('container').appendChild(stats.dom);
      stats.dom.style.cssText = 'position:absolute;bottom:0;left:0;';

      // Start animation loop
      animate();
    }

    function onWindowResize () {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function onMouseMove (event) {
      // Calculate mouse position in normalized device coordinates
      mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
      mouse.y = - (event.clientY / window.innerHeight) * 2 + 1;

      // Update tooltip position
      tooltip.style.left = (event.clientX + 10) + 'px';
      tooltip.style.top = (event.clientY + 10) + 'px';

      // Clear previous timeout to prevent multiple inspections
      if (mouseMoveTimeout) clearTimeout(mouseMoveTimeout);

      // Set a small delay to avoid too many raycasts
      mouseMoveTimeout = setTimeout(inspectVoxel, 50);
    }
    
    function inspectVoxel() {
      // Don't inspect if disabled
      if (!document.getElementById('enableInspection').checked || !worldMesh) {
        tooltip.style.display = 'none';
        lastInspectedVoxel = null;
        return;
      }

      // Update the picking ray
      raycaster.setFromCamera(mouse, camera);

      // Calculate objects intersecting the picking ray
      const intersects = raycaster.intersectObject(worldMesh);

      if (intersects.length > 0) {
        // Get the first intersected object (closest to camera)
        const intersect = intersects[0];

        // Get the instance index
        const instanceId = intersect.instanceId;

        if (instanceId !== undefined && instanceId < voxelData.length) {
          const voxel = voxelData[instanceId];
          const voxelInfo = VOXEL_TYPES[voxel.type] || VOXEL_TYPES[0];

          // Set tooltip content
          tooltip.innerHTML = `
            <div>Type: ${voxelInfo.name}</div>
            <div>Position: ${voxel.x}, ${voxel.y}, ${voxel.z}</div>
          `;

          // Show tooltip
          tooltip.style.display = 'block';
          lastInspectedVoxel = { ...voxel, typeName: voxelInfo.name };
          return;
        }
      }

      // Hide tooltip if no intersection
      tooltip.style.display = 'none';
      lastInspectedVoxel = null;
    }

    function animate () {
      requestAnimationFrame(animate);

      // Begin Stats measurement
      stats.begin();

      controls.update();

      // Determine which camera is main and which are PIPs
      let mainCamera = camera;
      let pipCameras = {
        topdown: topDownCamera,
        iso: isoCamera,
        fp: fpCamera
      };

      // Main view
      renderer.setViewport(0, 0, window.innerWidth, window.innerHeight);
      renderer.setScissorTest(false);
      renderer.render(scene, mainCamera);

      // Render PIPs only if they're not the active view
      const pipTop = 20, pipRight = 20;

      // --- Top-down PIP ---
      if (activeCameraMode !== 'topdown') {
        renderer.setViewport(
          window.innerWidth - pipWidth - pipRight,
          window.innerHeight - pipHeight - pipTop,
          pipWidth, pipHeight
        );
        renderer.setScissor(
          window.innerWidth - pipWidth - pipRight,
          window.innerHeight - pipHeight - pipTop,
          pipWidth, pipHeight
        );
        renderer.setScissorTest(true);
        renderer.render(scene, topDownCamera);
      }

      // --- Isometric PIP ---
      if (activeCameraMode !== 'iso') {
        const pipBottom = 20;
        renderer.setViewport(
          window.innerWidth - pipWidth - pipRight,
          pipBottom,
          pipWidth, pipHeight
        );
        renderer.setScissor(
          window.innerWidth - pipWidth - pipRight,
          pipBottom,
          pipWidth, pipHeight
        );
        renderer.setScissorTest(true);
        renderer.render(scene, isoCamera);
      }
      
      // --- First Person PIP ---
      if (activeCameraMode !== 'fp') {
        const fpPipBottom = 260;
        renderer.setViewport(
          window.innerWidth - pipWidth - pipRight,
          fpPipBottom,
          pipWidth, pipHeight
        );
        renderer.setScissor(
          window.innerWidth - pipWidth - pipRight,
          fpPipBottom,
          pipWidth, pipHeight
        );
        renderer.setScissorTest(true);
        renderer.render(scene, fpCamera);
      }

      renderer.setScissorTest(false); // Reset

      // End Stats measurement
      stats.end();
    }

    // Reset camera to default position
    document.getElementById('resetCamera').addEventListener('click', function() {
      resetCamera();
    });

    // Toggle grid
    document.getElementById('showGrid').addEventListener('change', function(e) {
      gridHelper.visible = e.target.checked;
    });

    // Toggle axes
    document.getElementById('showAxes').addEventListener('change', function(e) {
      axesHelper.visible = e.target.checked;
    });

    // Setup file input handler
    document.getElementById('fileInput').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          const worldData = e.target.result;
          loadWorld(worldData);
        };
        reader.readAsText(file);

        // Show loading indicator
        document.getElementById('loader').style.display = 'block';
      }
    });

    // Load sample world
    document.getElementById('sample-link').addEventListener('click', function() {
      // Show loading indicator
      document.getElementById('loader').style.display = 'block';

      // Fetch the sample world file
      fetch('sample_world.txt')
        .then(response => {
          if (!response.ok) {
            throw new Error('Network response was not ok');
          }
          return response.text();
        })
        .then(data => {
          loadWorld(data);
        })
        .catch(error => {
          console.error('Error loading sample world:', error);
          document.getElementById('info').innerHTML = `
            <p style="color: red;">Error loading sample world: ${error.message}</p>
            <p>Make sure you've created a sample world using the export_world utility.</p>
          `;
          document.getElementById('loader').style.display = 'none';
        });
    });

    // Save world data
    document.getElementById('saveWorld').addEventListener('click', function() {
      if (!currentWorldData) {
        alert('No world is currently loaded.');
        return;
      }

      // Create a blob from the world data
      const blob = new Blob([currentWorldData], { type: 'text/plain' });

      // Create a download link
      const a = document.createElement('a');
      a.download = 'world_export.txt';
      a.href = URL.createObjectURL(blob);

      // Append to body to trigger the download
      document.body.appendChild(a);
      a.click();

      // Clean up
      document.body.removeChild(a);
      URL.revokeObjectURL(a.href);
    });

    // Function to load and parse world data
    let currentWorldData = null; // Store current world data for saving

    function loadWorld (data) {
      // Store the world data for future export
      currentWorldData = data;

      // Clear existing world mesh if any
      if (worldMesh) {
        scene.remove(worldMesh);
        worldMesh.geometry.dispose();
        worldMesh = null;
        voxelData = [];
      }

      try {
        // Parse world data format
        // Format: [version:4][width:8][height:8][depth:8][voxels...]
        const version = parseInt(data.substring(0, 4), 16);
        const width = parseInt(data.substring(4, 12), 16);
        const height = parseInt(data.substring(12, 20), 16);
        const depth = parseInt(data.substring(20, 28), 16);
        const voxelsData = data.substring(28);

        // Update info panel
        document.getElementById('info').innerHTML = `
          <p>Version: ${version}</p>
          <p>Dimensions: ${width} x ${height} x ${depth}</p>
          <p>Total Voxels: ${width * height * depth}</p>
        `;

        // Store world dimensions
        worldWidth = width;
        worldHeight = height;
        worldDepth = depth;

        // Render the world
        renderWorld(voxelsData, width, height, depth);
      } catch (e) {
        console.error("Failed to parse world data:", e);
        document.getElementById('info').innerHTML = `
          <p style="color: red;">Error loading world: ${e.message}</p>
        `;
      } finally {
        // Hide loading indicator
        document.getElementById('loader').style.display = 'none';
      }
    }

    // Function to render the world using instanced mesh for better performance
    function renderWorld (voxelsData, width, height, depth) {
      const centerX = width / 2;
      const centerY = height / 2;
      const centerZ = depth / 2;

      // Create geometry, material, and mesh for instanced rendering
      const boxGeometry = new THREE.BoxBufferGeometry(1, 1, 1);
      const instancedMesh = new THREE.InstancedMesh(boxGeometry, new THREE.MeshLambertMaterial(), width * height * depth);
      instancedMesh.count = 0; // We'll increment this as we add instances

      const matrix = new THREE.Matrix4();
      const color = new THREE.Color();

      // Process each voxel
      let instanceCount = 0;
      for (let z = 0; z < depth; z++) {
        for (let y = 0; y < height; y++) {
          for (let x = 0; x < width; x++) {
            const index = z * (width * height) + y * width + x;
            if (index >= voxelsData.length) continue;

            // Convert hex character to voxel type
            const typeChar = voxelsData[index];
            let voxelType = 0; // Default to AIR

            if (/[0-9]/.test(typeChar)) {
              voxelType = parseInt(typeChar, 10);
            } else if (/[A-F]/.test(typeChar)) {
              voxelType = 10 + typeChar.charCodeAt(0) - 'A'.charCodeAt(0);
            } else if (/[a-f]/.test(typeChar)) {
              voxelType = 10 + typeChar.charCodeAt(0) - 'a'.charCodeAt(0);
            }

            // Skip AIR voxels (type 0)
            if (voxelType === 0) continue;

            // Get voxel properties
            const voxelProps = VOXEL_TYPES[voxelType] || VOXEL_TYPES[0];

            // Set position
            matrix.setPosition(
              x - centerX,
              y - centerY,
              z - centerZ
            );

            // Set color
            color.setHex(voxelProps.color);

            // Add instance
            instancedMesh.setMatrixAt(instanceCount, matrix);
            instancedMesh.setColorAt(instanceCount, color);

            // Store voxel data for inspection
            voxelData.push({
              x: x,
              y: y, 
              z: z,
              type: voxelType
            });

            instanceCount++;
          }
        }
      }

      // Update instance count
      instancedMesh.count = instanceCount;

      // Update instance matrices
      instancedMesh.instanceMatrix.needsUpdate = true;
      if (instancedMesh.instanceColor) {
        instancedMesh.instanceColor.needsUpdate = true;
      }

      // Add to scene
      scene.add(instancedMesh);
      worldMesh = instancedMesh;

      // Center camera on world
      resetCamera();

      // Update grid scale
      updateGridScale();

      console.log(`Rendered ${instanceCount} voxels`);
    }

    function resetCamera () {
      if (worldWidth && worldHeight && worldDepth) {
        const maxDimension = Math.max(worldWidth, worldHeight, worldDepth);
        camera.position.set(maxDimension, maxDimension, maxDimension);
        camera.lookAt(0, 0, 0);
        controls.update();
        // Update overlay cameras
        // Top-down
        topDownCamera.left = -maxDimension;
        topDownCamera.right = maxDimension;
        topDownCamera.top = maxDimension;
        topDownCamera.bottom = -maxDimension;
        topDownCamera.position.set(0, maxDimension * 2, 0);
        topDownCamera.lookAt(0, 0, 0);
        topDownCamera.updateProjectionMatrix();
        // Isometric
        const isoDist = maxDimension * 2;
        const isoAngle = Math.PI / 4;
        const isoElev = Math.atan(Math.sqrt(2));
        isoCamera.position.set(
          isoDist * Math.cos(isoAngle),
          isoDist * Math.sin(isoElev),
          isoDist * Math.sin(isoAngle)
        );
        isoCamera.lookAt(0, 0, 0);
        isoCamera.updateProjectionMatrix();
        // First person
        fpCamera.position.set(0, 1, 0);
        fpCamera.lookAt(10, 1, 0);
        fpCamera.updateProjectionMatrix();

        // Reset to main view
        activeCameraMode = 'main';
      } else {
        camera.position.set(50, 50, 50);
        camera.lookAt(0, 0, 0);
        controls.update();
        // Reset overlays to default
        topDownCamera.position.set(0, 100, 0);
        topDownCamera.lookAt(0, 0, 0);
        topDownCamera.left = -50;
        topDownCamera.right = 50;
        topDownCamera.top = 50;
        topDownCamera.bottom = -50;
        topDownCamera.updateProjectionMatrix();
        const isoDist = 100;
        const isoAngle = Math.PI / 4;
        const isoElev = Math.atan(Math.sqrt(2));
        isoCamera.position.set(
          isoDist * Math.cos(isoAngle),
          isoDist * Math.sin(isoElev),
          isoDist * Math.sin(isoAngle)
        );
        isoCamera.lookAt(0, 0, 0);
        isoCamera.updateProjectionMatrix();
        // First person default
        fpCamera.position.set(0, 1, 0);
        fpCamera.lookAt(10, 1, 0);
        fpCamera.updateProjectionMatrix();

        // Reset to main view
        activeCameraMode = 'main';
      }
    }

    function updateGridScale () {
      // If we have a world loaded, adjust grid size
      if (worldWidth && worldHeight && worldDepth) {
        // Remove old grid
        scene.remove(gridHelper);

        // Add new grid of appropriate size
        const maxDimension = Math.max(worldWidth, worldHeight, worldDepth);
        gridHelper = new THREE.GridHelper(maxDimension * 2, maxDimension * 2);
        gridHelper.visible = document.getElementById('showGrid').checked;
        scene.add(gridHelper);
      }
    }

    // Modal logic
    function showVoxelModal(voxel) {
      const modal = document.getElementById('voxel-modal');
      const content = document.getElementById('voxel-modal-content');
      content.innerHTML = `
        <strong>Type:</strong> ${voxel.typeName}<br>
        <strong>Coordinates:</strong> (${voxel.x}, ${voxel.y}, ${voxel.z})<br>
        <strong>Actors at this location:</strong><br>
        <em style="color:#aaa">No actor data available.</em>
      `;
      modal.style.display = 'flex';
    }
    document.getElementById('close-voxel-modal').onclick = function() {
      document.getElementById('voxel-modal').style.display = 'none';
    };
    document.getElementById('voxel-modal').onclick = function(e) {
      if (e.target === this) this.style.display = 'none';
    };
    function onVoxelClick(event) {
      // Only trigger if tooltip is visible and lastInspectedVoxel is set
      if (tooltip.style.display === 'block' && lastInspectedVoxel) {
        showVoxelModal(lastInspectedVoxel);
      }
    }

    function swapCameraView(newMode) {
      // Don't do anything if selecting the already active mode
      if (newMode === activeCameraMode) return;

      // Store the previous mode
      const previousMode = activeCameraMode;

      // Update active mode
      activeCameraMode = newMode;

      // If we're in main mode, switching to a PIP mode
      if (previousMode === 'main') {
        // Save main camera parameters before swap
        camera.userData.savedPosition = camera.position.clone();
        camera.userData.savedQuaternion = camera.quaternion.clone();
        camera.userData.savedTarget = controls.target.clone();

        // Update main camera with selected view
        if (newMode === 'topdown') {
          camera.position.copy(topDownCamera.position);
          camera.quaternion.copy(topDownCamera.quaternion);
          camera.up.copy(topDownCamera.up);
          controls.target.set(0, 0, 0);
        } else if (newMode === 'iso') {
          camera.position.copy(isoCamera.position);
          camera.quaternion.copy(isoCamera.quaternion);
          camera.up.set(0, 1, 0);
          controls.target.set(0, 0, 0);
        } else if (newMode === 'fp') {
          camera.position.copy(fpCamera.position);
          camera.quaternion.copy(fpCamera.quaternion);
          camera.up.set(0, 1, 0);
          controls.target.copy(new THREE.Vector3(10, 1, 0));
        }

        // Update controls
        controls.update();
      } 
      // If we're going back to main from a PIP mode
      else if (newMode === 'main') {
        // Restore saved main camera parameters
        camera.position.copy(camera.userData.savedPosition);
        camera.quaternion.copy(camera.userData.savedQuaternion);
        camera.up.set(0, 1, 0);
        controls.target.copy(camera.userData.savedTarget);
        controls.update();
      }
      // If we're switching between PIP modes
      else {
        // Update main camera with selected view
        if (newMode === 'topdown') {
          camera.position.copy(topDownCamera.position);
          camera.quaternion.copy(topDownCamera.quaternion);
          camera.up.copy(topDownCamera.up);
          controls.target.set(0, 0, 0);
        } else if (newMode === 'iso') {
          camera.position.copy(isoCamera.position);
          camera.quaternion.copy(isoCamera.quaternion);
          camera.up.set(0, 1, 0);
          controls.target.set(0, 0, 0);
        } else if (newMode === 'fp') {
          camera.position.copy(fpCamera.position);
          camera.quaternion.copy(fpCamera.quaternion);
          camera.up.set(0, 1, 0);
          controls.target.copy(new THREE.Vector3(10, 1, 0));
        }

        // Update controls
        controls.update();
      }
    }

    // Initialize the application
    init();

    // --- WebSocket Client for Actor Session ---
    // Generate a random actor ID (could be improved for real use)
    function generateActorId () {
      return 'actor-' + Math.random().toString(36).substr(2, 9);
    }

    // Local actor object
    const actor = {
      id: generateActorId(),
      state: {}
    };

    // Connect to WebSocket server
    const wsProtocol = window.location.protocol === 'https:' ? 'wss' : 'ws';
    const wsUrl = wsProtocol + '://' + window.location.hostname + ':3039/services/proxy';
    let ws = null;
    let wsRetryCount = 0;
    const maxRetries = 3;

    function connectWebSocket() {
      try {
        // Close any existing connection
        if (ws) {
          ws.onclose = null; // Disable the onclose handler to prevent recursion
          ws.close();
        }

        // Create new WebSocket connection
        ws = new WebSocket(wsUrl);

        ws.onopen = function () {
          console.log('WebSocket connected');
          wsRetryCount = 0; // Reset retry counter on successful connection

          // Send SESSION_START message with actor id
          try {
            const msg = {
              type: 'SESSION_START',
              id: actor.id
            };
            const jsonMsg = JSON.stringify(msg);
            console.log('Sending message:', jsonMsg);
            ws.send(jsonMsg);
            console.log('SESSION_START message sent successfully');
          } catch (err) {
            console.warn('Failed to send SESSION_START message:', err);
          }
        };

        ws.onmessage = function (event) {
          // Handle incoming messages
          try {
            console.log('Raw message received:', event.data);

            // First try to parse as JSON
            let data;
            try {
              data = JSON.parse(event.data);
              console.log('WebSocket message parsed as JSON:', data);
            } catch (parseError) {
              console.warn('Message is not valid JSON:', parseError);
              // Handle as text message
              console.log('Treating message as text:', event.data);

              // If this is an echo of our SESSION_START message, load the sample world
              if (event.data.includes('SESSION_START')) {
                console.log('Server echoed our SESSION_START message - loading sample world');
                loadSampleWorld();
                return;
              }

              // Can't process further without valid JSON
              return;
            }

            // Check if this is an echo of our own SESSION_START message
            if (data.type === 'SESSION_START') {
              console.log('Server echoed our SESSION_START message');

              // Load sample world directly
              loadSampleWorld();
            }
            // Handle actual WORLD_STATE messages (when server is properly implemented)
            else if (data.type === 'WORLD_STATE') {
              console.log('Received WORLD_STATE message with world data');

              // Update actor with server-provided ID if available
              if (data.actor_id) {
                actor.id = data.actor_id;
                console.log('Actor ID set to:', actor.id);
              }

              // Load the world if world_data is provided
              if (data.world_data) {
                loadWorld(data.world_data);

                // Update first-person camera position based on world
                updateFpCameraPosition();
              }
            }
          } catch (err) {
            console.warn('Error processing WebSocket message:', err);
          }
        };

        ws.onerror = function (err) {
          console.warn('WebSocket error. The server may not be running.', err);
          // We don't retry here - we'll let the onclose handler handle reconnection
        };

        ws.onclose = function (event) {
          console.log('WebSocket connection closed', event.code, event.reason);
          
          // Don't retry if closed normally or if we've exceeded max retries
          if (event.code === 1000 || wsRetryCount >= maxRetries) {
            console.log('WebSocket connection closed permanently');
            return;
          }

          // Exponential backoff for reconnect
          const retryDelay = Math.min(1000 * Math.pow(2, wsRetryCount), 10000);
          wsRetryCount++;
          
          console.log(`Attempting to reconnect (${wsRetryCount}/${maxRetries}) in ${retryDelay}ms...`);
          setTimeout(connectWebSocket, retryDelay);
        };
      } catch (err) {
        console.error('Failed to establish WebSocket connection:', err);
      }
    }

    // Start initial connection attempt
    connectWebSocket();

    // Update first-person camera position when actor moves
    function updateFpCameraPosition() {
      // In a real implementation, this would use the actor's actual position
      // For now, we'll just use a fixed position in front of the world
      if (worldWidth && worldHeight && worldDepth) {
        const eyeHeight = 1;
        fpCamera.position.set(-worldWidth/2, eyeHeight, 0);
        fpCamera.lookAt(-worldWidth/2 + 10, eyeHeight, 0);
        fpCamera.updateProjectionMatrix();
      }
    }

    // Helper function to load the sample world
    function loadSampleWorld () {
      // Fetch the sample world file
      fetch('sample_world.txt')
        .then(response => {
          if (!response.ok) {
            throw new Error('Network response was not ok');
          }
          return response.text();
        })
        .then(worldData => {
          loadWorld(worldData);

          // Update first-person camera position based on world
          updateFpCameraPosition();
        })
        .catch(error => {
          console.error('Error loading sample world:', error);
          document.getElementById('info').innerHTML = `
            <p style="color: red;">Error loading sample world: ${error.message}</p>
            <p>Make sure you've created a sample world using the export_world utility.</p>
          `;
        });
    }
  </script>
